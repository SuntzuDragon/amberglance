; amberglance — indoor clock + dashboard, Phase 1 base station
; ESP32-S3-DevKitC-1 N16R8 (16MB flash / 8MB octal PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 specifics — the stock board def assumes 8MB flash / no PSRAM.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
	-DBOARD_HAS_PSRAM
	; We flash and monitor over the CH343 bridge on the "UART" jack, so Serial
	; must be UART0 (GPIO43/44), not the native USB CDC. The native "USB" jack
	; enumerates but its ROM loader won't answer esptool's reset; the UART jack
	; has DTR/RTS wired to EN/BOOT and resets reliably. Set CDC_ON_BOOT=1 only
	; if you move back to the "USB" jack.
	-DARDUINO_USB_CDC_ON_BOOT=0
	; Uncomment if the panel shows the known blank-vertical-bar / shifted /
	; mirrored symptom described in HANDOFF.md. Applies the AliExpress-glass
	; column offset + re-map correction at runtime.
	; -DAMBER_PANEL_ALT_MAP
	; Hardware SPI. Bit-banging a full 8KB frame costs ~424ms on this panel;
	; the peripheral does it in single-digit milliseconds.
	-DAMBER_USE_HW_SPI
	; Boot-time layout collision check (see ui::debugLayout).
	-DAMBER_LAYOUT_DEBUG

lib_deps =
	olikraus/U8g2@^2.35.30
	sensirion/Sensirion I2C SHT4x@^1.1.2
	claws/BH1750@^1.3.0
